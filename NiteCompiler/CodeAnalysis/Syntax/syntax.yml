tokens:
  # None and EndOfFile is embedded in generator code
  - name: Tilde
    text: "~"
    unary: OnesComplementExpression
  - name: Exclamation
    text: "!"
    unary: NegationExpression
  - name: Question
    text: "?"
  - name: Ampersand
    text: "&"
    binary: AndExpression
    unary: AddressOfExpression
  - name: Bar
    text: "|"
    binary: OrExpression
  - name: Percent
    text: "%"
    binary: ModuloExpression
  - name: Caret
    text: "^"
    binary: XorExpression
  - name: Underscore
    text: "_"
  - name: OpenParen
    text: "("
  - name: CloseParen
    text: ")"
  - name: OpenBrace
    text: "{"
  - name: CloseBrace
    text: "}"
  - name: OpenBracket
    text: "["
  - name: CloseBracket
    text: "]"
  - name: Dot
    text: "."
  - name: Comma
    text: ","
  - name: Colon
    text: ":"
  - name: DoubleColon
    text: "::"
  - name: Semicolon
    text: ";"
  - name: Discard
    text: "_"
  - name: Plus
    text: "+"
    binary: AdditionExpression
    unary: UnaryAdditionExpression
  - name: Minus
    text: "-"
    binary: SubstractionExpression
    unary: UnarySubstractionExpression
  - name: Asterisk
    text: "*"
    binary: MultiplicationExpression
    unary: DereferenceExpression
  - name: Slash
    text: "/"
    binary: DivisionExpression
  - name: Backslash
    text: "\\"
  - name: Less
    text: "<"
    binary: LessExpression
  - name: Greater
    text: ">"
    binary: GreaterExpression
  - name: Range
    text: ".."
  - name: InclusiveRange
    text: "..="
    # these 3 produced at the parser, not in the lexer
  - name: RightShift
    text: ">>"
    binary: RightShiftExpression
  - name: UnsignedRightShift
    text: ">>>"
    binary: UnsignedRightShiftExpression
  - name: LeftShift
    text: "<<"
    binary: LeftShiftExpression

  # compound operators
  - name: PlusEquals
    text: "+="
    assignment: AdditionAssignmentExpression
  - name: MinusEquals
    text: "-="
    assignment: SubstractionAssignmentExpression
  - name: AsteriskEquals
    text: "*="
    assignment: MultiplicationAssignmentExpression
  - name: SlashEquals
    text: "/="
    assignment: DivisionAssignmentExpression
  - name: PercentEquals
    text: "%="
    assignment: ModuloAssignmentExpression
  - name: CaretEquals
    text: "^="
    assignment: XorAssignmentExpression
  - name: AmpersandEquals
    text: "&="
    assignment: AndAssignmentExpression
  - name: BarEquals
    text: "|="
    assignment: OrAssignmentExpression
  - name: RightShiftEquals
    text: ">>="
    assignment: RightShiftAssignmentExpression
  - name: UnsignedRightShiftEquals
    text: ">>>="
    assignment: UnsignedRightShiftAssignmentExpression
  - name: LeftShiftEquals
    text: "<<="
    assignment: LeftShiftAssignmentExpression

  - name: Equals
    text: "="
    binary: AssignmentExpression
  - name: DoubleEquals
    text: "=="
    binary: EqualsExpression
  - name: NotEquals
    text: "!="
    binary: NotEqualsExpression
  - name: LessEquals
    text: "<="
    binary: LessOrEqualsExpression
  - name: GreaterEquals
    text: ">="
    binary: GreaterOrEqualsExpression
  - name: DoubleAmpersand
    text: "&&"
    binary: LogicalAndExpression
  - name: DoubleBar
    text: "||"
    binary: LogicalOrExpression

  # keywords
  - name: TrueKeyword
    text: "true"
  - name: FalseKeyword
    text: "false"
  - name: NullKeyword
    text: "null"
  - name: DefaultKeyword
    text: "default"
  - name: PublicKeyword
    text: "public"
    contextual: true
  - name: FileKeyword
    text: "file"
    contextual: true

  # type keywords
  - name: BoolKeyword
    text: bool
  - name: I8Keyword
    text: i8
  - name: I16Keyword
    text: i16
  - name: I32Keyword
    text: i32
  - name: I64Keyword
    text: i64
  - name: I128Keyword
    text: i128
  - name: ISizeKeyword
    text: isize
  - name: U8Keyword
    text: u8
  - name: U16Keyword
    text: u16
  - name: U32Keyword
    text: u32
  - name: U64Keyword
    text: u64
  - name: U128Keyword
    text: u128
  - name: USizeKeyword
    text: usize
  - name: F16Keyword
    text: f16
  - name: F32Keyword
    text: f32
  - name: F64Keyword
    text: f64

  # trivia
  - name: EmptySpaceTrivia
    trivia: true
  - name: LineBreakTrivia
    trivia: true
  - name: NewLineTrivia
    trivia: true
  - name: SingleLineComment
    trivia: true
  - name: MultiLineComment
    trivia: true
  - name: SingleLineDocs
    trivia: true
  - name: MultiLineDocs
    trivia: true
  - name: ShebangTrivia
    trivia: true

  # literals
  - name: NumericLiteral

  # identifiers
  - name: Identifier
  - name: EscapedIdentifier

nodes:
  - name: SyntaxNode
    abstract: true
    members:
      - name: SyntaxTree
        type: SyntaxTree

  - name: Root
    base: SyntaxNode
    members:
      - name: Expressions
        type: <Expression>
      - name: EndOfFileToken
        type: SyntaxToken

  # expressions
  - name: Expression
    base: SyntaxNode
    abstract: true

  - name: LiteralExpression
    base: Expression
    members:
      - name: Token
        type: SyntaxToken
    kinds:
      - name: NumericLiteralExpression
        precedence: Primary
      - name: TrueLiteralExpression
        precedence: Primary
      - name: FalseLiteralExpression
        precedence: Primary

  - name: InterpolatedStringExpression
    base: Expression
    members:
      - name: BeginToken
        type: SyntaxToken
      - name: Content
        type: <SyntaxToken>
      - name: EndToken
        type: SyntaxToken

  - name: ParenthesizedExpression
    base: Expression
    members:
      - name: OpenParen
        type: SyntaxToken
      - name: Expression
        type: Expression
      - name: CloseParen
        type: SyntaxToken

  - name: UnaryExpression
    base: Expression
    members:
      - name: OperatorToken
        type: SyntaxToken
      - name: Value
        type: ExpressionSyntax
    kinds:
      - name: UnaryAdditionExpression # +x
        precedence: Unary
      - name: UnarySubstractionExpression # -x
        precedence: Unary
      - name: NegationExpression # !x
        precedence: Unary
      - name: OnesComplementExpression # ~x
        precedence: Unary
        # TODO: these two should be separate nodes
        # especially the AddressOfExpression, cause it's a complex expression
        # fact that they are currently here is a technical debt
      - name: AddressOfExpression # &x
        precedence: Unary
      - name: DereferenceExpression # *x
        precedence: Unary

  - name: BinaryExpression
    base: Expression
    members:
      - name: Left
        type: ExpressionSyntax
      - name: OperatorToken
        type: SyntaxToken
      - name: Right
        type: ExpressionSyntax
    kinds:
      - name: AdditionExpression # x + y
        precedence: Additive
      - name: SubstractionExpression # x - y
        precedence: Additive
      - name: MultiplicationExpression # x * y
        precedence: Multiplicative
      - name: DivisionExpression # x / y
        precedence: Multiplicative
      - name: ModuloExpression # x % y
        precedence: Multiplicative
      - name: AndExpression # x & y
        precedence: BitwiseAnd
      - name: XorExpression # x ^ y
        precedence: BitwiseXor
      - name: OrExpression # x | y
        precedence: BitwiseOr
      - name: RightShiftExpression # x >> y
        precedence: Shift
      - name: UnsignedRightShiftExpression # x >>> y
        precedence: Shift
      - name: LeftShiftExpression # x << y
        precedence: Shift

      - name: EqualsExpression # x == y
        precedence: Equality
      - name: NotEqualsExpression # x != y
        precedence: Equality
      - name: LessExpression # x < y
        precedence: Relational
      - name: LessOrEqualsExpression # x <= y
        precedence: Relational
      - name: GreaterExpression # x > y
        precedence: Relational
      - name: GreaterOrEqualsExpression # x >= y
        precedence: Relational

  - name: AssignmentExpression
    base: Expression
    members:
      - name: Left
        type: ExpressionSyntax
    kinds:
      - name: AssignmentExpression # x = y
        precedence: Assignment
      - name: AdditionAssignmentExpression # x += y
        precedence: Assignment
      - name: SubstractionAssignmentExpression # x -= y
        precedence: Assignment
      - name: MultiplicationAssignmentExpression # x *= y
        precedence: Assignment
      - name: DivisionAssignmentExpression # x /= y
        precedence: Assignment
      - name: ModuloAssignmentExpression # x %= y
        precedence: Assignment
      - name: AndAssignmentExpression # x &= y
        precedence: Assignment
      - name: XorAssignmentExpression # x ^= y
        precedence: Assignment
      - name: OrAssignmentExpression # x |= y
        precedence: Assignment
      - name: RightShiftAssignmentExpression # x >>= y
        precedence: Assignment
      - name: UnsignedRightShiftAssignmentExpression # x >>>= y
        precedence: Assignment
      - name: LeftShiftAssignmentExpression # x <<= y
        precedence: Assignment

  - name: LogicalAndExpression
    base: Expression
    members:
      - name: Left
        type: ExpressionSyntax
      - name: OperatorToken
        type: SyntaxToken
      - name: Right
        type: ExpressionSyntax
    kinds:
      - name: LogicalAndExpression # x && y
        precedence: ConditionalAnd

  - name: LogicalOrExpression
    base: Expression
    members:
      - name: Left
        type: ExpressionSyntax
      - name: OperatorToken
        type: SyntaxToken
      - name: Right
        type: ExpressionSyntax
    kinds:
      - name: LogicalOrExpression # x || y
        precedence: ConditionalOr

  # types
  - name: Type
    abstract: true
    base: Expression

  # names
  - name: Name
    abstract: true
    base: Type

  - name: PlainName
    abstract: true
    base: Name

  - name: IdentifierName
    base: PlainName
    members:
        - name: Identifier
          type: SyntaxToken

  # TODO: Add GenericName

  # items
  - name: Item
    abstract: true
    base: SyntaxNode

  - name: Attribute
    base: SyntaxNode
    members:
      - name: Name
        type: Name

  - name: AttributeList
    base: SyntaxNode
    members:
      - name: Hash
        type: SyntaxToken
      - name: OpenBracket
        type: SyntaxToken
      - name: Attributes
        type: separated<Attribute>
      - name: CloseBracket
        type: SyntaxToken

  - name: ModuleDeclaration
    base: Item
    members:
      - name: ModuleKeyword
        type: SyntaxToken
      - name: Members
        type: <Item>

  - name: BaseTypeDeclaration
    abstract: true
    base: Item
    members:
      - name: AccessibilityModifierToken
        type: SyntaxToken
        null_safety: nullable