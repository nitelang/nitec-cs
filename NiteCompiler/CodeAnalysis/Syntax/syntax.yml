tokens:
  # None and EndOfFile is embedded in generator code
  - name: Tilde
    text: "~"
  - name: Exclamation
    text: "!"
  - name: Question
    text: "?"
  - name: Ampersand
    text: "&"
  - name: Bar
    text: "|"
  - name: Percent
    text: "%"
  - name: Caret
    text: "^"
  - name: Underscore
    text: "_"
  - name: OpenParen
    text: "("
  - name: CloseParen
    text: ")"
  - name: OpenBrace
    text: "{"
  - name: CloseBrace
    text: "}"
  - name: OpenBracket
    text: "["
  - name: CloseBracket
    text: "]"
  - name: Dot
    text: "."
  - name: Comma
    text: ","
  - name: Colon
    text: ":"
  - name: DoubleColon
    text: "::"
  - name: Semicolon
    text: ";"
  - name: Plus
    text: "+"
  - name: Minus
    text: "-"
  - name: Asterisk
    text: "*"
  - name: Slash
    text: "/"
  - name: Backslash
    text: "\\"
  - name: Less
    text: "<"
  - name: Greater
    text: ">"
  - name: Range
    text: ".."
  - name: InclusiveRange
    text: "..="
    # these 3 produced at the parser, not in the lexer
  - name: RightShift
    text: ">>"
  - name: UnsignedRightShift
    text: ">>>"
  - name: LeftShift
    text: "<<"

  # compound operators
  - name: PlusEquals
    text: "+="
  - name: MinusEquals
    text: "-="
  - name: AsteriskEquals
    text: "*="
  - name: SlashEquals
    text: "/="
  - name: PercentEquals
    text: "%="
  - name: CaretEquals
    text: "^="
  - name: AmpersandEquals
    text: "&="
  - name: BarEquals
    text: "|="
  - name: RightShiftEquals
    text: ">>="
  - name: UnsignedRightShiftEquals
    text: ">>>="
  - name: LeftShiftEquals
    text: "<<="

  - name: DoubleEquals
    text: "=="
  - name: NotEquals
    text: "!="
  - name: LessEquals
    text: "<="
  - name: GreaterEquals
    text: ">="

  # keywords
  - name: TrueKeyword
    text: "true"
  - name: FalseKeyword
    text: "false"
  - name: NullKeyword
    text: "null"
  - name: DefaultKeyword
    text: "default"
  - name: PublicKeyword
    text: "public"
    contextual: true
  - name: FileKeyword
    text: "file"
    contextual: true

  # type keywords
  - name: BoolKeyword
    text: bool
  - name: I8Keyword
    text: i8
  - name: I16Keyword
    text: i16
  - name: I32Keyword
    text: i32
  - name: I64Keyword
    text: i64
  - name: I128Keyword
    text: i128
  - name: ISizeKeyword
    text: isize
  - name: U8Keyword
    text: u8
  - name: U16Keyword
    text: u16
  - name: U32Keyword
    text: u32
  - name: U64Keyword
    text: u64
  - name: U128Keyword
    text: u128
  - name: USizeKeyword
    text: usize
  - name: F16Keyword
    text: f16
  - name: F32Keyword
    text: f32
  - name: F64Keyword
    text: f64

  # trivia
  - name: EmptySpaceTrivia
    trivia: true
  - name: NewLineTrivia
    trivia: true
  - name: SingleLineComment
    trivia: true
  - name: MultiLineComment
    trivia: true
  - name: ShebangTrivia
    trivia: true

nodes:
  - name: SyntaxNode
    abstract: true
    members:
      - name: SyntaxTree
        type: SyntaxTree

  - name: Root
    base: SyntaxNode
    members:
      - name: Expressions
        type: [Expression]
      - name: EndOfFileToken
        type: SyntaxToken

  - name: Expression
    base: SyntaxNode
    abstract: true

  - name: UnaryExpression
    base: Expression
    members:
      - name: OperatorToken
        type: SyntaxToken
      - name: Value
        type: ExpressionSyntax
    kinds:
      - name: UnaryAdditionExpression # +x
        precedence: Unary
      - name: UnarySubstractionExpression # -x
        precedence: Unary
      - name: NegationExpression # !x
        precedence: Unary
      - name: OnesComplementExpression # ~x
        precedence: Unary
        # TODO: these two should be separate nodes
        # especially the AddressOfExpression, cause it's a complex expression
        # fact that they are currently here is a technical debt
      - name: AddressOfExpression # &x
        precedence: Unary
      - name: DereferenceExpression # *x
        precedence: Unary

  - name: BinaryExpression
    base: Expression
    members:
      - name: Left
        type: ExpressionSyntax
      - name: OperatorToken
        type: SyntaxToken
      - name: Right
        type: ExpressionSyntax
    kinds:
      - name: AdditionExpression # x + y
        precedence: Additive
      - name: AdditionAssignmentExpression # x += y
        precedence: Assignment

      - name: SubstractionExpression # x - y
        precedence: Additive
      - name: SubstractionAssignmentExpression # x -= y
        precedence: Assignment

      - name: MultiplicationExpression # x * y
        precedence: Multiplicative
      - name: MultiplicationAssignmentExpression # x *= y
        precedence: Assignment

      - name: DivisionExpression # x / y
        precedence: Multiplicative
      - name: DivisionAssignmentExpression # x /= y
        precedence: Assignment

      - name: ModuloExpression # x % y
        precedence: Multiplicative
      - name: ModuloAssignmentExpression # x %= y
        precedence: Assignment

      - name: AndExpression # x & y
        precedence: BitwiseAnd
      - name: AndAssignmentExpression # x &= y
        precedence: Assignment

      - name: XorExpression # x ^ y
        precedence: BitwiseXor
      - name: XorAssignmentExpression # x ^= y
        precedence: Assignment

      - name: OrExpression # x | y
        precedence: BitwiseOr
      - name: OrAssignmentExpression # x |= y
        precedence: Assignment

      - name: RightShiftExpression # x >> y
        precedence: Shift
      - name: RightShiftAssignmentExpression # x >>= y
        precedence: Assignment

      - name: UnsignedRightShiftExpression # x >>> y
        precedence: Shift
      - name: UnsignedRightShiftAssignmentExpression # x >>>= y
        precedence: Assignment

      - name: LeftShiftExpression # x << y
        precedence: Shift
      - name: LeftShiftAssignmentExpression # x <<= y
        precedence: Assignment

      - name: EqualsExpression # x == y
        precedence: Equality
      - name: NotEqualsExpression # x != y
        precedence: Equality

      - name: LessExpression # x < y
        precedence: Relational
      - name: LessOrEqualsExpression # x <= y
        precedence: Relational

      - name: GreaterExpression # x > y
        precedence: Relational
      - name: GreaterOrEqualsExpression # x >= y
        precedence: Relational

  - name: LogicalAndExpression
    base: Expression
    members:
      - name: Left
        type: ExpressionSyntax
      - name: OperatorToken
        type: SyntaxToken
      - name: Right
        type: ExpressionSyntax
    kinds:
      - name: LogicalAndExpression # x && y
        precedence: ConditionalAnd

  - name: LogicalOrExpression
    base: Expression
    members:
      - name: Left
        type: ExpressionSyntax
      - name: OperatorToken
        type: SyntaxToken
      - name: Right
        type: ExpressionSyntax
    kinds:
      - name: LogicalOrExpression # x || y
        precedence: ConditionalOr

  - name: Item
    abstract: true
    base: SyntaxNode

  - name: ModuleDeclaration
    base: Item
    members:
      - name: ModuleKeyword
        type: SyntaxToken
      - name: Members
        type: [Item]

  - name: BaseTypeDeclaration
    abstract: true
    base: Item
    members:
      - name: AccessibilityModifierToken
        type: SyntaxToken
        null_safety: nullable